<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="구몬학습">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F5F5F5">
<title>구몬학습 프로토타입</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="viewport">
  <div id="stage" aria-live="polite">
    <!-- 정적 화면: JS가 채움 -->
    <div id="screens"></div>

    <!-- 화상 수업 -->
    <section class="screen" id="scr-video" data-screen="video" hidden>
      <img class="bg" src="img/board.png" alt="" draggable="false">
      <div id="pages" hidden><img id="pageL" alt="" draggable="false"><img id="pageR" alt="" draggable="false"></div>
      <canvas id="ink"></canvas>
      <div id="objs"></div>
      <div id="pager">
        <button class="pg" id="pgPrev" aria-label="이전 페이지"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="pg-meta"><b id="pgA">6a</b><i></i><b id="pgB">6b</b><span id="pgN">1 / 3</span></div>
        <button class="pg" id="pgNext" aria-label="다음 페이지"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>

      <div id="ai" hidden>
        <div id="aiImg" role="button" aria-label="AI 캐릭터">
          <video id="aiOn" class="v-on" src="media/ai_on.mp4" poster="media/ai_on.jpg" muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
          <video id="aiListen" class="v-listen" src="media/ai_listen.mp4" poster="media/ai_listen.jpg" muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
        </div>
        <div id="aiBubble"></div>
      </div>

      <!-- 좌측 판서 툴바 -->
      <div id="pdoc">
        <img id="pdocImg" src="img/p/pdoc_off_off.png" alt="" draggable="false">
        <img id="toolsImg" src="img/p/tool_pen.png" alt="" draggable="false">
        <button class="hit" id="btnFold" aria-label="패널 접기"></button>
        <button class="hit" id="btnAI" aria-label="AI 캐릭터"></button>
        <div id="toolHits"></div>
        <div id="toolSwatch"></div>
        <button class="hit act" id="btnUndo" aria-label="실행 취소"></button>
        <button class="hit act" id="btnRedo" aria-label="다시 실행"></button>
        <div id="palette" hidden></div>
      </div>

      <!-- 우측 화상 패널 -->
      <div id="pvid">
        <img id="pvImg" src="img/p/pv_video.png" alt="" draggable="false">
        <div id="timer" class="timer">00:00</div>
        <div id="tvBig" class="tv"><video src="media/teacher.mp4" poster="media/teacher.jpg" muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture></video><span class="tv-name"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>김구몬 선생님</span></div>
        <div id="tvSmall" class="tv"><video src="media/teacher.mp4" poster="media/teacher.jpg" muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture></video></div>
        <img id="tile" src="img/p/tile_on_on.png" alt="내 화면" draggable="false">
        <div id="myCam" hidden>
          <video id="myCamVideo" muted playsinline webkit-playsinline autoplay disablepictureinpicture></video>
          <span class="tv-name"><svg id="myMic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/><path class="slash" d="M3 3l18 18"/></svg>박명지</span>
        </div>
        <div id="tabHits">
          <button class="hit tab" data-tab="video" aria-label="비디오"></button>
          <button class="hit tab" data-tab="chat" aria-label="채팅"></button>
          <button class="hit tab" data-tab="note" aria-label="교재"></button>
        </div>
        <div id="noteHits"></div>
        <div id="chat">
          <div id="chatList"></div>
          <form id="chatForm" autocomplete="off">
            <input id="chatInput" type="text" placeholder="채팅을 입력하세요." enterkeyhint="send" maxlength="80">
            <button id="chatSend" type="submit" disabled>전송</button>
          </form>
        </div>
        <img id="chip" src="img/p/chip_hand.png" alt="선생님 질문 있어요!" draggable="false" hidden>
        <div id="controls">
          <button class="ctl" data-ctl="mic" aria-label="마이크"><img alt="" draggable="false"></button>
          <button class="ctl" data-ctl="cam" aria-label="카메라"><img alt="" draggable="false"></button>
          <button class="ctl" data-ctl="hand" aria-label="손들기"><img alt="" draggable="false"></button>
          <button class="ctl" data-ctl="exit" aria-label="수업 나가기"><img alt="" draggable="false"></button>
        </div>
      </div>
    </section>

    <!-- 모달 -->
    <div id="dim" hidden></div>
    <div class="modal" id="modal-exit" hidden>
      <img src="img/p/modal_exit.png" alt="수업에서 나갈까요?" draggable="false">
      <button class="hit m-close" data-act="close" style="left:264px;top:16px;width:44px;height:44px" aria-label="닫기"></button>
      <button class="hit" data-act="close" style="left:24px;top:80px;width:132px;height:44px" aria-label="돌아가기"></button>
      <button class="hit" data-act="leaveClass" style="left:168px;top:80px;width:132px;height:44px" aria-label="수업 나가기"></button>
    </div>
    <div class="modal" id="modal-leave" hidden>
      <img src="img/p/modal_leave.png" alt="수정한 내용을 저장하지 않을까요?" draggable="false">
      <button class="hit m-close" data-act="close" style="left:264px;top:16px;width:44px;height:44px" aria-label="닫기"></button>
      <button class="hit" data-act="close" style="left:24px;top:104px;width:132px;height:44px" aria-label="계속 수정"></button>
      <button class="hit" data-act="discard" style="left:168px;top:104px;width:132px;height:44px" aria-label="나가기"></button>
    </div>
    <div class="modal" id="modal-soon" hidden>
      <img src="img/p/modal_soon.png" alt="열심히 준비 중이에요" draggable="false">
      <button class="hit m-close" data-act="close" style="left:320px;top:16px;width:44px;height:44px" aria-label="닫기"></button>
      <button class="hit" data-act="close" style="left:24px;top:244px;width:160px;height:44px" aria-label="닫기"></button>
      <button class="hit" data-act="notify" style="left:196px;top:244px;width:160px;height:44px" aria-label="알림 설정하기"></button>
    </div>

    <div id="toast" role="status"></div>
  </div>
</div>

<div id="home" hidden>
  <div class="hs-status">
    <span class="hs-time" id="hsTime"></span>
    <span class="hs-right">
      <svg class="hs-wifi" viewBox="0 0 18 13" aria-hidden="true"><path fill="#fff" d="M9 2.6c2.6 0 5 1 6.8 2.7l1.3-1.3C14.9 1.9 12 .7 9 .7S3.1 1.9.9 4l1.3 1.3C4 3.6 6.4 2.6 9 2.6Zm0 3.6c1.6 0 3.1.6 4.3 1.6l1.3-1.3C13.1 5.1 11.1 4.3 9 4.3s-4.1.8-5.6 2.2l1.3 1.3C5.9 6.8 7.4 6.2 9 6.2Zm0 3.6c.6 0 1.2.2 1.7.6L9 12.1l-1.7-1.7c.5-.4 1.1-.6 1.7-.6Z"/></svg>
      <span>100%</span>
      <svg class="hs-batt" viewBox="0 0 28 13" aria-hidden="true"><rect x=".5" y=".5" width="24" height="12" rx="3.6" fill="none" stroke="#fff" stroke-opacity=".45"/><rect x="2" y="2" width="21" height="9" rx="2.2" fill="#fff"/><path d="M26 4.3v4.4c.9-.3 1.5-1.2 1.5-2.2s-.6-1.9-1.5-2.2Z" fill="#fff" fill-opacity=".45"/></svg>
    </span>
  </div>
  <div class="hs-grid" id="hsGrid"></div>
  <div class="hs-dots"><i class="on"></i><i></i></div>
  <div class="hs-dock" id="hsDock"></div>
</div>

<div id="rotate" hidden>
  <div>
    <strong>태블릿을 가로로 돌려주세요</strong>
    <span>구몬학습은 가로 화면에 맞춰져 있어요.</span>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
